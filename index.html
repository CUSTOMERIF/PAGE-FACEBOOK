<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>VIETGROUP AI</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
    }

    * {
      box-sizing: border-box;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #070b14;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #070b14;
      color: white;
      font-family: Arial, sans-serif;
      transition: opacity .25s ease, visibility .25s ease;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .box {
      text-align: center;
      padding: 24px 28px;
      border-radius: 18px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
    }

    .box strong {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .box span {
      font-size: 13px;
      color: #9fb0c8;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="box">
      <strong>VIETGROUP AI</strong>
      <span>Đang tải Web App...</span>
    </div>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbx9j6Jnyf2OldQ7jbg2KXDAuaf9A7ZhelgLGI09_zKFS3zTOJmYTPQF-QxF6-gZmj2TdQ/exec"
    title="VIETGROUP AI"
    allow="clipboard-read; clipboard-write; fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    const frame = document.getElementById("app");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", function () {
      setTimeout(function () {
        loading.classList.add("hide");
      }, 250);
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VIETGROUP AI">

  <title>VIETGROUP AI</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
    }

    #webapp {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #070b14;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #070b14;
      color: #fff;
      font-family: Arial, sans-serif;
      transition: opacity .25s ease, visibility .25s ease;
      pointer-events: none;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
    }

    .box {
      padding: 20px 24px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      text-align: center;
    }

    .box strong {
      display: block;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .box span {
      color: #9fb0c8;
      font-size: 12px;
    }

    #installBtn {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 10000;
      display: none;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(7,11,20,.92);
      color: #fff;
      font: 600 13px Arial, sans-serif;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    #installBtn.show {
      display: block;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="box">
      <strong>VIETGROUP AI</strong>
      <span>Đang tải hệ thống...</span>
    </div>
  </div>

  <iframe
    id="webapp"
    src="https://script.google.com/macros/s/AKfycbx9j6Jnyf2OldQ7jbg2KXDAuaf9A7ZhelgLGI09_zKFS3zTOJmYTPQF-QxF6-gZmj2TdQ/exec"
    title="VIETGROUP AI"
    sandbox="allow-scripts allow-forms allow-same-origin allow-modals allow-downloads allow-popups"
    allow="clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <button id="installBtn" type="button">Cài ứng dụng</button>

  <script>
    const frame = document.getElementById("webapp");
    const loading = document.getElementById("loading");
    const installBtn = document.getElementById("installBtn");

    frame.addEventListener("load", function () {
      setTimeout(function () {
        loading.classList.add("hide");
      }, 300);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js").catch(function (err) {
          console.warn("Service Worker:", err);
        });
      });
    }

    let deferredPrompt = null;

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.classList.add("show");
    });

    installBtn.addEventListener("click", async function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.remove("show");
    });

    window.addEventListener("appinstalled", function () {
      deferredPrompt = null;
      installBtn.classList.remove("show");
    });
  </script>

</body>
</html>

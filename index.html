<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>VIETGROUP AI</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
    }

    #webapp {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #070b14;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #070b14;
      color: #fff;
      font-family: Arial, sans-serif;
      transition: opacity .25s ease, visibility .25s ease;
      pointer-events: none;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
    }

    .box {
      padding: 20px 24px;
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      text-align: center;
    }

    .box strong {
      display: block;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .box span {
      color: #9fb0c8;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="box">
      <strong>VIETGROUP AI</strong>
      <span>Đang tải hệ thống...</span>
    </div>
  </div>

  <iframe
    id="webapp"
    src="https://script.google.com/macros/s/AKfycbx9j6Jnyf2OldQ7jbg2KXDAuaf9A7ZhelgLGI09_zKFS3zTOJmYTPQF-QxF6-gZmj2TdQ/exec"
    title="VIETGROUP AI"
    sandbox="allow-scripts allow-forms allow-same-origin allow-modals allow-downloads allow-popups"
    allow="clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const frame = document.getElementById("webapp");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", function () {
      setTimeout(function () {
        loading.classList.add("hide");
      }, 300);
    });
  </script>

</body>
</html>

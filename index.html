<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>VIETGROUP AI</title>

  <!-- Fallback nếu JavaScript bị tắt -->
  <meta http-equiv="refresh" content="2;url=https://script.google.com/macros/s/AKfycbx9j6Jnyf2OldQ7jbg2KXDAuaf9A7ZhelgLGI09_zKFS3zTOJmYTPQF-QxF6-gZmj2TdQ/exec">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #070b14;
      color: #eef6ff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 10%, rgba(101,230,255,.10), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(167,139,250,.10), transparent 30%),
        #070b14;
    }

    .card {
      width: min(92vw, 360px);
      padding: 28px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      background: rgba(13,21,36,.88);
      box-shadow: 0 24px 70px rgba(0,0,0,.38);
      backdrop-filter: blur(16px);
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      font-size: 28px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(135deg, rgba(101,230,255,.18), rgba(167,139,250,.20));
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: .05em;
    }

    p {
      margin: 8px 0 0;
      color: #8ea0b8;
      font-size: 13px;
    }

    .bar {
      height: 4px;
      margin: 20px 0 18px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
    }

    .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #65e6ff, #a78bfa);
      animation: loading 1s ease-in-out infinite alternate;
    }

    @keyframes loading {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }

    a {
      display: inline-block;
      padding: 11px 16px;
      border-radius: 13px;
      color: #eef6ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
    }

    a:hover {
      background: rgba(255,255,255,.10);
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">◈</div>
    <h1>VIETGROUP AI</h1>
    <p>Đang chuyển tới Web App...</p>

    <div class="bar"><span></span></div>

    <a href="https://script.google.com/macros/s/AKfycbx9j6Jnyf2OldQ7jbg2KXDAuaf9A7ZhelgLGI09_zKFS3zTOJmYTPQF-QxF6-gZmj2TdQ/exec" id="openApp">
      Mở Web App
    </a>
  </main>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx9j6Jnyf2OldQ7jbg2KXDAuaf9A7ZhelgLGI09_zKFS3zTOJmYTPQF-QxF6-gZmj2TdQ/exec";

    // Không dùng iframe để tránh lỗi "refused to connect".
    // Chuyển trực tiếp trình duyệt sang Google Apps Script Web App.
    setTimeout(() => {
      window.location.replace(WEB_APP_URL);
    }, 350);
  </script>
</body>
</html>
